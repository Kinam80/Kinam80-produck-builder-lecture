<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기남월드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="flower-canvas"></canvas>
    <div class="cyworld-container">
        <div class="settings">
            <label for="bg-color-picker">배경 색상:</label>
            <input type="color" id="bg-color-picker">
        </div>
        <div class="header">
            <h1>미니홈피</h1>
        </div>
        <div class="main-content">
            <div class="profile">
                <label for="profile-picture-input">
                    <img id="profile-picture" src="https://via.placeholder.com/200" alt="프로필 사진">
                </label>
                <input type="file" id="profile-picture-input" accept="image/*" style="display: none;">
                <p>이름: 권기남</p>
                <p>상태: 오늘도 좋은 하루!</p>
            </div>
            <div class="content">
                <h2>다이어리</h2>
                <div class="diary-entry">
                    <h3>2026-02-19</h3>
                    <p>오늘은 싸이월드 클론 코딩을 시작했다. 재미있다!</p>
                </div>

                <h2>추억 사진</h2>
                <div class="memory-photos">
                    <input type="file" id="memory-photo-input" accept="image/*" multiple style="display: none;">
                    <button id="add-memory-photo">사진 추가</button>
                    <div class="memory-photos-grid">
                        <!-- 추억 사진들이 여기에 표시됩니다 -->
                    </div>
                </div>

                <h2>방명록</h2>
                <div class="guestbook">
                    <textarea id="guestbook-message" placeholder="여기에 메시지를 남겨주세요..."></textarea>
                    <button id="submit-guestbook-entry">글 남기기</button>
                    <div class="guestbook-entries">
                        <!-- 방명록 메시지들이 여기에 표시됩니다 -->
                    </div>
                </div>
            </div>
        </div>
        <div class="sidebar">
            <h2>미니룸</h2>
            <div class="mini-room">
                <!-- 미니룸 아이템들이 여기에 들어갑니다. -->
            </div>
        </div>
        <div class="footer">
            <p>&copy; 2026 Cyworld Clone</p>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
