<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>싸이월드 회원가입</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>회원가입</h2>
        <input type="text" id="reg-username" placeholder="아이디">
        <input type="password" id="reg-password" placeholder="비밀번호">
        <input type="password" id="reg-password-confirm" placeholder="비밀번호 확인">
        <input type="text" id="reg-name" placeholder="이름">
        <button id="register-button">가입하기</button>
        <div class="links">
            <a href="login.html">로그인 페이지로 돌아가기</a>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
